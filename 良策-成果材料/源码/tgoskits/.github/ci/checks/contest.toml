# Contest host/static Python contracts (Liangce team, private delivery).
#
# These are deterministic host contracts: they do not create Guest-IP, AI-loop
# or real-time A/B evidence by themselves. They run unconditionally in the
# static phase (like the rest of the static manifest), which matches their
# historical wiring in the pre-v3 workflow. No impact_targets is declared so
# they are always enforced.

schema_version = 3
phase = "static"
group = "Contest"
default_runner = "qcs"

[[check]]
id = "contest-upstream-p4-baseline"
name = "Locked upstream P4 integration baseline preflight"
command = '''
python3 scripts/test/check_contest_upstream_p4_baseline.py
'''

