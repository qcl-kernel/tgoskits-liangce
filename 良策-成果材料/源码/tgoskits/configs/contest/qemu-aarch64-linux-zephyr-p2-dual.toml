# f964 P2 no-data-plane outer QEMU profile.
# The shared runtime injects fresh QMP, pidfile and name arguments into a
# resolved copy; this checked-in input contains no personal or run-specific path.
args = [
  "-nographic",
  "-nic",
  "none",
  "-cpu",
  "cortex-a72",
  "-machine",
  "virt,virtualization=on,gic-version=3",
  "-smp",
  "4",
  "-m",
  "8g",
]
fail_regex = [
  "(?i)Failed to initialize guest VM",
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
  "ESR_EL2:",
  "ELR_EL2:",
  "FAR_EL2:",
  "AXVISOR_DUAL_GUEST_LINUX_FAIL",
  "AXVISOR_DUAL_GUEST_ZEPHYR_FAIL",
]
success_regex = []
timeout = 900
to_bin = true
uefi = false
