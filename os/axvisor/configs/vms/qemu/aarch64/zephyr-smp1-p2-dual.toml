# f964 P2 VM2: typed Zephyr, no Guest data-plane device.

[base]
id = 2
name = "zephyr-qemu-smp1-p2-dual"
guest_type = "virtualized"
cpu_num = 1
phys_cpu_ids = [2]

[kernel]
entry_point = 0x4000_117c
image_location = "memory"
kernel_path = "/path/to/zephyr.bin"
kernel_load_addr = 0x4000_0000
dtb_load_addr = 0x47e0_0000

memory_regions = [
  [0x4000_0000, 0x0800_0000, 0x7, 0],
]

[devices]
passthrough = []
disabled = []
