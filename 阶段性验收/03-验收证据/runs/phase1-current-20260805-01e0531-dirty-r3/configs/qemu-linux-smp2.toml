args = [
  "-nographic",
  "-cpu",
  "cortex-a72",
  "-machine",
  "virt,virtualization=on,gic-version=3",
  "-smp",
  "4",
  "-device",
  "virtio-blk-device,drive=disk0",
  "-append",
  "root=/dev/vda rw init=/bin/sh",
  "-m",
  "8g",
]
fail_regex = [
  "(?i)Failed to initialize guest VM",
  "(?i)ITS \\[mem 0x[0-9a-f]+-0x[0-9a-f]+\\]",
  "(?i)GICv3: Expected reserved range .*not found",
  "(?i)GICv3: CPU[0-9]+: Booted with LPIs enabled, memory probably corrupted",
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
  "(?i)login incorrect",
  "(?i)permission denied",
  "(?m)^linux-smp2-proc-mount-failed\\s*$",
  "(?m)^linux-smp2-cpu-count=[0-9]+\\s*$",
]
success_regex = ["(?m)^linux-smp2-pass\\s*$"]
shell_prefix = "~ #"
shell_init_cmd = "marker=linux-smp2; if [ ! -r /proc/cpuinfo ]; then /bin/busybox mount -t proc proc /proc || { printf '%s-proc-mount-failed\\n' \"$marker\"; exit 1; }; fi; cpu_count=0; while IFS=: read -r key value; do case \"$key\" in processor*) cpu_count=$((cpu_count + 1));; esac; done < /proc/cpuinfo; if [ \"$cpu_count\" -eq 2 ]; then printf '%s-pass\\n' \"$marker\"; else printf '%s-cpu-count=%s\\n' \"$marker\" \"$cpu_count\"; fi"
to_bin = true
uefi = false
