# Contest Linux+Zephyr dual-Guest outer QEMU (P4 mediated network).
#
# No outer NIC and no root block: the Linux rootfs travels as initramfs
# (memory + ramdisk) and guest networking is entirely the host-owned vnet0
# switch. The P4 runner appends the QMP socket, pidfile and QEMU name for
# identity binding and drives the scenario markers itself; `timeout` here
# is only a bounded fallback.
args = [
  "-nographic",
  "-nic",
  "none",
  "-cpu",
  "cortex-a72",
  "-machine",
  "virt,virtualization=on,gic-version=3",
  "-smp",
  "4",
  "-m",
  "4g",
  "-qmp",
  "unix:/tmp/axp4-fe4bcbc57373482d9f68d54a2a880918/qmp.sock,server=on,wait=off",
  "-pidfile",
  "/tmp/axp4-fe4bcbc57373482d9f68d54a2a880918/qemu.pid",
  "-name",
  "axvisor-dual-smoke-fe4bcbc57373482d9f68d54a2a880918",
]
fail_regex = [
  "(?i)Failed to initialize guest VM",
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)kernel panic",
  "ESR_EL2:",
  "AXVISOR_DUAL_GUEST_LINUX_FAIL",
  "AXVISOR_DUAL_GUEST_ZEPHYR_FAIL",
]
success_regex = []
timeout = 900
to_bin = true
uefi = false
