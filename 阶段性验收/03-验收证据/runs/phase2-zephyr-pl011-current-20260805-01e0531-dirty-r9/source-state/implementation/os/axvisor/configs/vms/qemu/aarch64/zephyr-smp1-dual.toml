# Contest Linux+Zephyr static ownership contract.
# status: blocked_dma_console
# Slot 2 is intentionally excluded until passthrough DMA and console gates close.

[base]
# Zephyr is VM 2 and owns only pCPU 2.
id = 2
name = "zephyr-qemu-dual"
vm_type = 1
cpu_num = 1
phys_cpu_ids = [2]

[kernel]
entry_point = 0x4000_10b4
image_location = "memory"
kernel_path = "/path/to/zephyr.bin"
kernel_load_addr = 0x4000_0000
dtb_load_addr = 0x47e0_0000

# MapAlloc remains the validated single-guest RAM mode and is why DMA is gated.
memory_regions = [
  [0x4000_0000, 0x0800_0000, 0x7, 0],
]

[devices]
interrupt_mode = "passthrough"

# GPPT GIC plus a VM-owned TX-only polling PL011. The console has no HPA,
# delivered IRQ, RX, DMA, or backend argument and does not close the gate.
emu_devices = [
  ["gppt-gicd", 0x0800_0000, 0x1_0000, 0, 0x21, []],
  ["gppt-gicr", 0x080a_0000, 0x2_0000, 0, 0x20, [1, 0x2_0000, 2]],
  ["zephyr", 0x0900_0000, 0x1000, 0, 0x2, []],
]

# Zephyr currently receives only CPU-control, timer, and interrupt structure.
passthrough_devices = [
  ["/psci"],
  ["/timer"],
  ["/intc@8000000"],
]

passthrough_addresses = []

# The ITS and host PL011 are never shared. All virtio slots stay excluded while
# slot 2 lacks a safe DMA mapping and the independent console runtime gate is unvalidated.
excluded_devices = [
  ["/intc@8000000/its@8080000"],
  ["/pl011@9000000"],
  ["/virtio_mmio@a000000"],
  ["/virtio_mmio@a000200"],
  ["/virtio_mmio@a000400"],
]
