args = [
  "-nographic",
  "-cpu",
  "cortex-a72",
  "-machine",
  "virt,virtualization=on,gic-version=3",
  "-smp",
  "4",
  "-m",
  "8g",
]
fail_regex = [
  "Guest console evidence failed closed",
  "(?i)Failed to initialize guest VM",
  "(?i)ITS \\[mem 0x[0-9a-f]+-0x[0-9a-f]+\\]",
  "(?i)GICv3: Expected reserved range .*not found",
  "(?i)GICv3: CPU[0-9]+: Booted with LPIs enabled, memory probably corrupted",
  "(?i)\\bpanic(?:ked)?\\b",
  "(?i)fatal error",
  "(?i)assertion failed",
  "(?m)^TGOS_ZEPHYR_SMOKE_FAIL(?: .*)?\\r?$",
]
# The Guest stream is hex-encoded inside strict host frame records. Never end
# QEMU on a partial frame; the bounded runner demultiplexes and validates after
# QEMU exits.
success_regex = []
to_bin = true
uefi = false

