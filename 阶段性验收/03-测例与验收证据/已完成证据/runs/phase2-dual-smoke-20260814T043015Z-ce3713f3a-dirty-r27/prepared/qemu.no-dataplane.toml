args = [
  "-nographic",
  "-cpu",
  "cortex-a72",
  "-machine",
  "virt,virtualization=on,gic-version=3",
  "-smp",
  "4",
  "-m",
  "8g",
  "-drive",
  "id=disk0,if=none,format=raw,file=/placeholder-dual-rootfs.img",
  "-device",
  "virtio-blk-device,id=linux-root,drive=disk0,bus=virtio-mmio-bus.0",
  "-append",
  "root=/dev/vda rw init=/init console=ttyAMA0,115200 earlycon=pl011,mmio32,0x9000000 keep_bootcon",
]

fail_regex = ["(?i)Failed to initialize guest VM", "(?i)ITS \\[mem 0x[0-9a-f]+-0x[0-9a-f]+\\]", "(?i)GICv3: Expected reserved range .*not found", "(?i)GICv3: CPU[0-9]+: Booted with LPIs enabled, memory probably corrupted", "(?i)\\bpanic(?:ked)?\\b", "(?i)kernel panic", "(?m)^AXVISOR_LINUX_CONSOLE_FAIL.*$"]
success_regex = ["(?m)^AXVISOR_DUAL_GUEST_LINUX_READY.*$", "(?m)^AXVISOR_DUAL_GUEST_ZEPHYR_READY.*$"]
to_bin = true
uefi = false
