# Contest Linux+Zephyr dual-Guest VM: Zephyr (VM 2).
#
# Official-baseline format: the mediated VirtIO-net frontend is declared as
# a `[[devices.virtual]]` model "virtio-net" with the fixed contest MAC.
# MMIO/IRQ are resolved by the device graph (`ResourceRequest::Auto`) and
# are emitted into the final guest DTB by the runtime FDT patch; they are
# not written here. The Zephyr image path is resolved by the P4 runner
# from the build manifest.

[base]
id = 2
name = "zephyr-qemu-dual"
guest_type = "virtualized"
cpu_num = 1
phys_cpu_ids = [2]

[kernel]
entry_point = 0x4000_117c
image_location = "memory"
kernel_path = "/mnt/f/project/泉城实验室/tgoskits-upstream-integration/tmp/contest/p4-prepared/20260820-21ef/zephyr-network/zephyr.bin"
kernel_load_addr = 0x4000_0000
dtb_load_addr = 0x47e0_0000

# System RAM 128M MAP_ALLOC (Zephyr qemu_cortex_a53 link contract).
memory_regions = [
  [0x4000_0000, 0x0800_0000, 0x7, 0],
]

#
# Device specifications
#

# Physical-device selection. Virtual platform devices are machine-owned.
[devices]
passthrough = []
disabled = []

[[devices.virtual]]
id = "virtnet0"
model = "virtio-net"
guest_mac = [0x02, 0x00, 0x00, 0x00, 0x00, 0x02]
