# Contest Zephyr control guest (P4 network skeleton, P5 plant/control).
# P4: low-priority network thread with l3-smoke / udp-echo / tcp-listen modes.

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_NATIVE=y
CONFIG_ETH_VIRTIO_NET=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.77.0.2"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="10.77.0.1"
CONFIG_NET_CONFIG_INIT_PRIO=50

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_BOOT_BANNER=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ARMV8_A_NS=y

# P5 control skeleton options (kept minimal for P4).
CONFIG_DUAL_BOOT_ID="unknown"
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y


# The board no longer selects NET_L2_ETHERNET (its e1000/PCIe path is
# disabled); the virtio-net driver needs it, so force it on here. ETH_DRIVER
# then defaults to y.
CONFIG_NET_L2_ETHERNET=y

# P5-AI-Q (TEST-017): longer closed-loop runs need more net buffers; the
# default pool starved after ~30-40 s of sustained ACK/STATUS traffic and
# the netstack began dropping ACKs (observed per-tick stalls of 8 s).
CONFIG_NET_PKT_RX_COUNT=128
CONFIG_NET_PKT_TX_COUNT=64
CONFIG_NET_BUF_RX_COUNT=128
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_IF_UNICAST_IPV4_ADDR_COUNT=2
CONFIG_NET_MAX_CONTEXTS=16

# P5-AI-Q (TEST-017): keep the fixed peer in the ARP cache for the whole
# 180 s run.  With the default timeout the entry expired mid-run and the
# resulting ARP storm flooded the RX path (observed ~150 ARP frames and
# per-tick 8 s ACK stalls after ~70 s).
CONFIG_NET_ARP_TIMEOUT=3600
