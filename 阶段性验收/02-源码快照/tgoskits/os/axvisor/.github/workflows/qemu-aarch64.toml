args = [
  "-nographic",
  "-cpu",
  "cortex-a72",
  "-machine",
  "virt,virtualization=on,gic-version=3",
  "-smp",
  "4",
  "-device",
  "virtio-blk-device,drive=disk0",
  # "-drive",
  # "id=disk0,if=none,format=raw,file=${workspaceFolder}/tmp/rootfs.img",
  "-append",
  "root=/dev/vda rw init=/bin/sh",
  "-m",
  "8g",
]
fail_regex = [
    "panicked at",
    "(?i)Failed to initialize guest VM",
    "(?i)ITS \\[mem 0x[0-9a-f]+-0x[0-9a-f]+\\]",
    "(?i)GICv3: Expected reserved range .*not found",
    "(?i)GICv3: CPU[0-9]+: Booted with LPIs enabled, memory probably corrupted",
]
success_regex = [
    "Hello, world!",
    "test pass!",
]
to_bin = true
uefi = false
