# Contest single-Guest Zephyr PL011 framed-console smoke template.
#
# Keep zephyr-smp1.toml as the legacy raw-console baseline. This profile adds
# only a VM-owned polling PL011 and excludes QEMU's physical host PL011.

[base]
id = 1
name = "zephyr-qemu-pl011-framed"
vm_type = 1
cpu_num = 1
phys_cpu_ids = [0]

[kernel]
entry_point = 0x4000_10b4
image_location = "memory"
kernel_path = "/path/to/zephyr.bin"
kernel_load_addr = 0x4000_0000
dtb_load_addr = 0x47e0_0000

# Zephyr qemu_cortex_a53 links RAM at 0x4000_0000. The generator replaces
# only the entry point and image path after checking the locked ELF/BIN pair.
memory_regions = [
  [0x4000_0000, 0x0800_0000, 0x7, 0],
]

[devices]
interrupt_mode = "passthrough"

# GPPT GIC plus one VM-owned TX-only polling PL011. IRQ 0 is a sentinel: the
# device has no delivered IRQ, backend, RX, DMA, clock, or extra arguments.
emu_devices = [
  ["gppt-gicd", 0x0800_0000, 0x1_0000, 0, 0x21, []],
  ["gppt-gicr", 0x080a_0000, 0x2_0000, 0, 0x20, [1, 0x2_0000, 0]],
  ["zephyr", 0x0900_0000, 0x1000, 0, 0x2, []],
]

# Retain the validated single-Guest passthrough topology while removing the
# host PL011. Guest-FDT synthesis installs the polling-only replacement node.
passthrough_devices = [
  ["/"],
]

passthrough_addresses = []

excluded_devices = [
  ["/pl011@9000000"],
  ["/intc@8000000/its@8080000"],
]
