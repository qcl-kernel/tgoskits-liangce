# Contest Linux+Zephyr static ownership contract.
# status: blocked_dma_console
# This file is not run-ready until DMA and independent guest-console gates close.

[base]
# Linux remains VM 1 and owns pCPUs 0 and 1.
id = 1
name = "linux-qemu-smp2-dual"
vm_type = 1
cpu_num = 2
phys_cpu_ids = [0, 1]

[kernel]
entry_point = 0x8020_0000
image_location = "fs"
kernel_path = "/guest/linux/linux-qemu"
kernel_load_addr = 0x8020_0000
dtb_load_addr = 0x8000_0000

# Keep the validated Linux SMP2 identity-mapped 256 MiB RAM contract.
memory_regions = [
  [0x8000_0000, 0x1000_0000, 0x7, 1],
]

[devices]
interrupt_mode = "passthrough"

# Path-only ownership. Address and SPI discovery must come from the filtered FDT.
passthrough_devices = [
  ["/chosen"],
  ["/psci"],
  ["/timer"],
  ["/intc@8000000"],
  ["/virtio_mmio@a000000"], # slot 0: Linux root block, SPI offset 16 / INTID 48
  ["/virtio_mmio@a000200"], # slot 1: Linux IP network, SPI offset 17 / INTID 49
]

passthrough_addresses = []

# Fail closed on the ITS, shared host PL011, and the Zephyr network slot.
excluded_devices = [
  ["/intc@8000000/its@8080000"],
  ["/pl011@9000000"],
  ["/virtio_mmio@a000400"],
]

# GPPT GIC plus a VM-owned TX-only polling PL011. The console has no HPA,
# clock, delivered IRQ, RX, DMA, or backend argument. It is only an earlycon
# source contract until the locked Linux kernel passes its runtime gate.
emu_devices = [
  ["gppt-gicd", 0x0800_0000, 0x1_0000, 0, 0x21, []],
  ["gppt-gicr", 0x080a_0000, 0x2_0000, 0, 0x20, [2, 0x2_0000, 0]],
  ["linux", 0x0900_0000, 0x1000, 0, 0x2, []],
]
